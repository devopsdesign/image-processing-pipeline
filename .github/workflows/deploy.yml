name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  PYTHON_VERSION: "3.11"
  # Region is not a secret. Set repo Variable OR Secret AWS_REGION to override.
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    env:
      AWS_XRAY_SDK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check lambda tests app

      - name: Pytest
        run: pytest

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    name: Terraform apply
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-cloudsight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Preflight - required config
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          SNS_EMAIL: ${{ secrets.SNS_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          miss=0
          [ -n "$AWS_ACCESS_KEY_ID" ]     || { echo "::error::Missing secret AWS_ACCESS_KEY_ID"; miss=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::Missing secret AWS_SECRET_ACCESS_KEY"; miss=1; }
          [ -n "$TF_STATE_BUCKET" ]       || { echo "::error::Missing secret TF_STATE_BUCKET (e.g. cloudsight-tfstate-<ACCOUNT_ID>)"; miss=1; }
          [ -n "$SNS_EMAIL" ]             || { echo "::error::Missing secret SNS_EMAIL"; miss=1; }
          echo "Region: $AWS_REGION"
          [ "$miss" -eq 0 ] || { echo "::error::Set the missing repository secrets under Settings -> Secrets and variables -> Actions"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform state bucket
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket already exists: $BUCKET"
          else
            echo "Creating state bucket $BUCKET in $AWS_REGION"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Build Lambda package
        run: bash scripts/build_lambda.sh

      - name: Terraform init (S3 backend)
        working-directory: terraform
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_sns_email: ${{ secrets.SNS_EMAIL }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_use_rekognition: ${{ vars.USE_REKOGNITION || 'false' }}
        run: terraform apply -auto-approve -input=false

      - name: Publish outputs to run summary
        working-directory: terraform
        run: |
          IN=$(terraform output -raw input_bucket)
          OUT=$(terraform output -raw output_bucket)
          TBL=$(terraform output -raw dynamodb_table)
          {
            echo "## CloudSight Intake deployed"
            echo ""
            echo "Paste these into the Streamlit app's **Secrets** panel:"
            echo ""
            echo '```toml'
            echo "AWS_REGION     = \"${AWS_REGION}\""
            echo "INPUT_BUCKET   = \"${IN}\""
            echo "OUTPUT_BUCKET  = \"${OUT}\""
            echo "DYNAMODB_TABLE = \"${TBL}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
