name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda function
        run: |
          cd lambda
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .
          zip -r ../lambda_function.zip .
          cd ..

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/
        continue-on-error: true

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan -var="sns_email=${{ secrets.SNS_EMAIL }}"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get outputs
        id: outputs
        working-directory: terraform
        run: |
          INPUT_BUCKET=$(terraform output -raw input_bucket 2>/dev/null | tr -d '[:space:]')
          LAMBDA_NAME=$(terraform output -raw lambda_function_name 2>/dev/null | tr -d '[:space:]')

          echo "input_bucket=$INPUT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "lambda_name=$LAMBDA_NAME" >> "$GITHUB_OUTPUT"

          echo "DEBUG: Captured input_bucket: $INPUT_BUCKET" >&2
          echo "DEBUG: Captured lambda_name: $LAMBDA_NAME" >&2
        env:
          TF_IN_AUTOMATION: true
          TF_INPUT: false

      - name: Show deployment summary
        run: |
          echo "Lambda function deployed: ${{ steps.outputs.outputs.lambda_name }}"
          echo "Input bucket: ${{ steps.outputs.outputs.input_bucket }}"
          echo "This deployment stays intentionally lightweight for a portfolio/demo setup."