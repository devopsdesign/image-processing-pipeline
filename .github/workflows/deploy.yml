name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  PYTHON_VERSION: "3.11"
  TF_STATE_KEY: "cloudsight-intake/terraform.tfstate"

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    env:
      AWS_XRAY_SDK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check lambda tests app

      - name: Pytest
        run: pytest

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    name: Terraform apply
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-cloudsight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Lambda package
        run: bash scripts/build_lambda.sh

      - name: Terraform init (S3 backend)
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_sns_email: ${{ secrets.SNS_EMAIL }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_use_rekognition: ${{ vars.USE_REKOGNITION || 'false' }}
        run: terraform apply -auto-approve -input=false

      - name: Show outputs
        working-directory: terraform
        run: terraform output
