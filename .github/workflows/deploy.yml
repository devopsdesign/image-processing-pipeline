name: Deploy

# Manual only. Lint + unit tests -> provision with Terraform -> run a real
# image through the pipeline with a freshly generated random image -> email the
# result to the maintainer.
on:
  workflow_dispatch:
    inputs:
      run_test:
        description: Run the post-deploy image-processing test
        type: boolean
        default: true
      use_rekognition:
        description: Enable Amazon Rekognition (12-month free tier; off = always-free)
        type: boolean
        default: false

permissions:
  contents: read

concurrency: cloudsight-lifecycle

env:
  TF_VERSION: "1.10.5"
  PYTHON_VERSION: "3.11"
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Preflight - required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          SNS_EMAIL: ${{ secrets.SNS_EMAIL }}
        run: |
          set -e
          miss=0
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_STATE_BUCKET SNS_EMAIL; do
            eval "val=\${$v}"
            [ -n "$val" ] || { echo "::error::Missing repository secret $v"; miss=1; }
          done
          echo "Region: $AWS_REGION"
          [ "$miss" -eq 0 ] || { echo "::error::Add the missing secrets under Settings -> Secrets and variables -> Actions"; exit 1; }

      - name: Lint & unit tests
        env:
          AWS_XRAY_SDK_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -r requirements-dev.txt
          ruff check lambda tests app
          pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform state bucket
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket exists: $BUCKET"
          else
            echo "Creating state bucket $BUCKET in $AWS_REGION"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Build Lambda package
        run: bash scripts/build_lambda.sh

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_sns_email: ${{ secrets.SNS_EMAIL }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_use_rekognition: ${{ inputs.use_rekognition }}
        run: terraform apply -auto-approve -input=false

      - name: Deployment outputs
        working-directory: terraform
        run: |
          {
            echo "## CloudSight Intake deployed"
            echo ""
            echo "Streamlit Secrets:"
            echo '```toml'
            echo "AWS_REGION     = \"$AWS_REGION\""
            echo "INPUT_BUCKET   = \"$(terraform output -raw input_bucket)\""
            echo "OUTPUT_BUCKET  = \"$(terraform output -raw output_bucket)\""
            echo "DYNAMODB_TABLE = \"$(terraform output -raw dynamodb_table)\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------- post-deploy image-processing test ----------------
      - name: Generate a random test image
        if: ${{ inputs.run_test }}
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import os, random
          from PIL import Image
          w, h = 480, 320
          img = Image.new("RGB", (w, h))
          img.putdata([(random.randrange(256), random.randrange(256), random.randrange(256)) for _ in range(w * h)])
          path = "/tmp/cloudsight-test.jpg"
          img.save(path, "JPEG", quality=85)
          print("wrote", path, os.path.getsize(path), "bytes")
          PY

      - name: Run image-processing test
        id: smoke
        if: ${{ inputs.run_test }}
        run: |
          set -o pipefail
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh /tmp/cloudsight-test.jpg | tee /tmp/smoke.log
          {
            echo "summary<<SMOKE_EOF"
            tail -n 40 /tmp/smoke.log
            echo "SMOKE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test result to job summary
        if: ${{ always() && inputs.run_test }}
        run: |
          {
            echo "## Image-processing test"
            echo '```'
            cat /tmp/smoke.log 2>/dev/null || echo "(test did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------- notification (same SNS topic the Lambda uses) ----------------
      - name: Notify via SNS
        if: ${{ always() }}
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_SUMMARY: ${{ steps.smoke.outputs.summary }}
        run: |
          set -o pipefail
          TOPIC=$(terraform -chdir=terraform output -raw sns_topic_arn 2>/dev/null || true)
          if [ -z "$TOPIC" ]; then
            ACCT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)
            [ -n "$ACCT" ] && TOPIC="arn:aws:sns:${AWS_REGION}:${ACCT}:cloudsight-intake-notifications"
          fi
          if [ -z "$TOPIC" ]; then
            echo "::warning::No SNS topic ARN available - skipping notification"
            exit 0
          fi
          {
            printf 'CloudSight Intake deploy: %s\n\n' "$JOB_STATUS"
            printf 'Repo   : %s\n' "$REPO"
            printf 'Region : %s\n' "$AWS_REGION"
            printf 'By     : @%s (manual)\n' "$ACTOR"
            printf 'Run    : %s\n\n' "$RUN_URL"
            printf 'Image-processing test:\n%s\n' "${SMOKE_SUMMARY:-skipped or not reached}"
          } > /tmp/sns-msg.txt
          aws sns publish --topic-arn "$TOPIC" \
            --subject "[CloudSight] Deploy ${JOB_STATUS} (run #${RUN_NUMBER})" \
            --message file:///tmp/sns-msg.txt \
            && echo "Published deploy status to $TOPIC" \
            || echo "::warning::SNS publish failed"
